name: Civilizations
version: '2.0.0-alpha.53'
main: dev.civilizations.CivilizationsPlugin
api-version: '26.1.2'
folia-supported: true
author: yomamaeatstoes
description: Local model agents and region-owned villager work
commands:
  playerai:
    description: Spawn and manage human-looking AI pioneers
    permission: civilizations.playerai.admin
    usage: /playerai [spawn [name]|list|status|pause|resume|remove]
  civilizations:
    aliases: [civ]
    description: Manage local villager settlements
    permission: civilizations.admin
    usage: /civ status|inspect|create|pause|resume|plan|ai|design|coreai
permissions:
  civilizations.playerai.admin:
    default: op
  civilizations.admin:
    default: op
