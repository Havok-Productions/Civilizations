name: Hearth
version: '${project.version}'
main: dev.hearth.HearthPlugin
api-version: '26.2'
folia-supported: true
author: yomamaeatstoes
description: AI-assisted villager collective - builds walls, digs dry mines, lights, gathers, and sleeps at night.
website: https://github.com/Havok-Productions/Civilizations
depend: []
softdepend: []
commands:
  hearth:
    description: Main Hearth command.
    usage: /<command> <help|list|status|wall|mine|light|chest|ai|reload|stop>
permissions:
  hearth.admin:
    description: Allows use of all Hearth commands.
    default: op
  hearth.player:
    description: Allows basic Hearth status commands.
    default: true
