# ============================================================
#  Hearth - AI-assisted villager collective
#  Re-run /hearth reload after editing.
# ============================================================

settings:
  # Master on/off for the whole plugin.
  enabled: true

  # Villagers are moved at roughly normal walking speed (no 100 mph zoomies).
  # 0.22 blocks/tick ~= 2.2 blocks/second ~= a brisk but human-looking walk.
  # If a villager gets stuck, Hearth may take one small "step" (teleport)
  # up to step-assist-distance blocks to keep looking natural.
  movement:
    max-speed: 0.22
    step-assist: true
    step-assist-distance: 2.2
    face-direction: true

  # Anti-lag budgets. Hearth never does unbounded work in one tick.
  performance:
    pathfind-budget-per-tick: 6000      # A* node expansions per server tick (split across all villagers)
    max-path-radius: 96                 # Search radius in blocks
    max-path-depth: 56000               # Hard cap on node expansions per single path
    block-reads-per-villager-per-tick: 24
    block-writes-per-villager-per-tick: 6

villages:
  # Minimum villagers before a group counts as a village.
  min-size: 1
  # How far a villager/bed/house must be from the village center to count.
  radius: 48
  # Re-detect villages every N ticks (60 ticks = 1 second).
  rescan-interval: 600

# ---- Community chest ----------------------------------------
chest:
  # Automatically place a shared "community chest" if the village doesn't have one.
  auto-place: true
  # How close to the village center the chest may be.
  max-distance: 24
  # How many items a villager will carry before depositing at the chest.
  max-carry: 16

# ---- Walls (mob protection) ---------------------------------
walls:
  auto-build: true
  # Material used for the wall. Use something villagers can mine directly
  # (STONE, COBBLESTONE, DIRT, SAND, OAK_LOG...). STONE looks good and mines straight off stone.
  material: STONE
  # Wall height in blocks.
  height: 4
  # Build a 3-wide gated entrance in the south wall.
  gate: true
  # Door material (any door).
  gate-material: OAK_DOOR
  # Minimum integrity (0-1) before villagers treat the wall as "needs repair".
  repair-below: 0.8

# ---- Lighting -------------------------------------------------
lighting:
  # Light source material. GLOWSTONE mines directly and gives light level 15.
  material: GLOWSTONE
  # Place lights just inside the wall ring.
  wall-ring: true
  # Light the community chest area.
  chest-area: true
  # Light every 8th column of the mine tunnel.
  mine: true
  # Minimum light level a spot needs before a light is added.
  min-light-level: 8

# ---- Mining (underground) -------------------------------------
mining:
  enabled: true
  # Tunnel floor depth. Deepslate ores (iron, gold, diamond, redstone) live low.
  depth: -40
  # How long the tunnel is, in columns (each column is 4 blocks, one pillar in 4).
  length: 64
  # Tunnel width (blocks). 3 is comfortable for villagers.
  width: 3
  # Leave a full pillar every N columns (room-and-pillar method so nothing caves in).
  pillar-every: 4
  # Never dig through water, lava, bedrock, or house blocks.
  avoid-water: true
  avoid-lava: true
  avoid-house-blocks: true
  # How many alternative routes Hearth tries before giving up on a mine.
  max-route-attempts: 6

# ---- Sleeping -------------------------------------------------
sleep:
  enabled: true
  # Villagers go to bed in this time window (Minecraft time: 0 = midnight, 6000 = 6 AM, 12000 = noon, 18000 = 6 PM, 24000 = midnight).
  # Default matches vanilla: sleep ~5:20 PM, wake ~7:00 AM.
  sleep-from: 17000
  sleep-until: 7000

# ---- Defense ----------------------------------------------------
defense:
  # If a hostile mob gets within this radius, the villager flees to the safe spot.
  flee-radius: 8
  # Safe spot is the chest location (or village center if no chest).
  safe-spot: chest

# ---- Village society (v1.2) ----------------------------------------
# The village acts like a small society: villagers talk with their neighbors,
# keep a shared book on a bookshelf, claim jobs so nobody does the same work
# twice, post "needs" anyone can pick up, and (optionally) ask their Quen
# agent for advice when they are stuck.
society:
  # Master on/off for all society features.
  enabled: true
  # How close a villager must be (blocks) to "hear" what a neighbor is doing.
  gossip-radius: 6
  # How often (ticks) a villager re-checks its neighbors. 120 = every 6 s.
  gossip-interval-ticks: 120
  # When a neighbor is right next to them, how long (ticks) the villager pauses
  # and faces them while "talking". 40 = 2 s of conversation.
  gossip-pause-ticks: 40
  # Auto-place a BOOKSHELF next to the community chest (the village library).
  bookshelf: true
  # How far from the chest the bookshelf may be.
  bookshelf-max-distance: 8
  # Max lines kept in the village book (oldest drop off).
  book-max-entries: 200
  # Villagers write "we need <material>" lines to the book; idle or redundant
  # villagers pick them up and deliver the material to the chest.
  needs: true
  # How long (ms) a need stays claimed before it can be re-claimed. 5 minutes.
  need-stale-ms: 300000
  # Job claims: each build/mine job can be claimed by exactly one villager so
  # two villagers never dig the same block or build the same wall section.
  job-claims: true
  # How long (ms) a job claim stays valid before it expires.
  job-claim-ttl-ms: 60000
  # A stuck villager may ask its Quen agent for advice (applied as village
  # advice, with the local safety rules still winning).
  ai-consult: true
  # Minimum time (ms) between two stuck-consults per villager. 10 minutes.
  ai-consult-cooldown-ms: 600000

# ---- Quen AI core (optional, makes the village smarter) --------
# The AI lives INSIDE the plugin: a pool of "Quen" mini-agents, one per
# subset of villages, each with its own persistent memory file.
#
#   plugins/Civilizations/
#     memory/agent-1/<villageId>.json   <- what agent 1 learned (human-readable)
#     memory/agent-2/<villageId>.json
#     memory/agent-3/<villageId>.json
#     local-ai/bin/llama-server(.exe)   <- local runtime (backend: local only)
#     local-ai/models/<model>.gguf
#
# Local rules ALWAYS win for safety (villagers always sleep at night, always
# flee mobs) no matter what the model says. If the AI is down or still
# booting, local rules keep the village running.
ai:
  # ON by default: the Quen agents run the villagers' priorities, and with the
  # local backend the first start downloads the runtime + model (~1.1 GB) into
  # local-ai/. Set to false to run on local rules only.
  enabled: true
  # backend:
  #   - "local"    -> Hearth downloads a llama.cpp server + Qwen model into
  #                   its own local-ai/ folder on first enable and runs the AI
  #                   on this machine (no internet needed after first run).
  #   - "external" -> call a remote OpenAI-compatible API (DeepSeek, ChatGPT,
  #                   LM Studio, ...). No downloads, no local CPU/GPU load.
  backend: local
  # How many mini-agents run the villagers (each owns a stable subset of
  # villages and keeps its own memory). 1 is fine for a few villages.
  agents-count: 3
  # How often (minutes) to re-ask an agent per village.
  interval-minutes: 4
  # Chat parameters (both backends).
  temperature: 0.2
  max-tokens: 220
  timeout-seconds: 25

  # ---- local Quen runtime (backend: local) ------------------------
  local:
    # Port for the bundled llama-server (127.0.0.1 only). If busy, +1..+9 are
    # tried automatically.
    port: 8642
    # Context size for the model (tokens). 4096 is plenty for these reports.
    context-size: 4096
    # CPU threads for inference. Set to your physical cores (4-8 is a good
    # default for a 1.5B model).
    threads: 4
    # The Qwen ("Quen") model, downloaded from Hugging Face on first run.
    # Default: Qwen2.5 1.5B Instruct Q4_K_M (~950 MB) - fast on CPU, plenty for
    # picking the next village task.
    model-repo: "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
    model-file: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
    # Bigger brain (needs ~2.5 GB RAM + more CPU time):
    #   model-repo: "Qwen/Qwen3-4B-GGUF"
    #   model-file: "Qwen3-4B-Q4_K_M.gguf"
    # GPU (CUDA) inference:
    #   - "auto" (default) -> use the CUDA build of llama.cpp when this machine
    #     has an NVIDIA GPU (e.g. RTX 5070); fall back to the CPU build.
    #   - "cuda"           -> force the CUDA build (needs an NVIDIA GPU).
    #   - "cpu"            -> always use the CPU build.
    # Windows: the CUDA .zip bundles the runtime, only the NVIDIA driver is
    # needed. Linux: needs a CUDA-capable driver (12.x+).
    gpu: auto

  # ---- external API (backend: external) ----------------------------
  # Both DeepSeek and OpenAI speak the OpenAI-compatible /chat/completions API.
  external:
    base-url: "https://api.deepseek.com/v1"
    # base-url: "https://api.openai.com/v1"
    model: "deepseek-chat"
    # model: "gpt-4o-mini"
    api-key: "sk-put-your-key-here"

  # The village charter every agent sees (and remembers per village).
  charter: |
    Hearth is a peaceful collective. Priorities when choosing one task:
      1. SURVIVAL - repair or build walls if integrity is below 80%, especially at night.
      2. SHELTER  - ensure a community chest exists.
      3. LIGHT    - keep the village and mine lit to discourage mobs.
      4. FOOD & RESOURCES - gather stone and mine ores into the chest.
      5. IDLE     - rest, keep villagers near the village.
    Prefer the task that most reduces risk or unblocks everything else.
